name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate MultiBond tooling
        run: |
          bash -n scripts/multibond-smoke.sh scripts/install-exit-systemd.sh scripts/multibond-doctor.sh
          python3 -m py_compile scripts/generate-multibond-config.py
          tmpdir="$(mktemp -d)"
          python3 scripts/generate-multibond-config.py --role=client --channels=examples/channels.example.csv --out="$tmpdir/client.conf" --bond-max=256 --bond-active=6
          python3 scripts/generate-multibond-config.py --role=exit --channels=examples/channels.example.csv --out="$tmpdir/exit.conf" --bond-max=256 --bond-active=6
          test "$(grep -c '^\\[Transport ' "$tmpdir/client.conf")" -eq 6
          test "$(grep -c '^\\[Transport ' "$tmpdir/exit.conf")" -eq 6
          rm -rf "$tmpdir"
      - name: Local MultiBond end-to-end
        run: bash scripts/multibond-e2e-local.sh
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - name: Compile isolated Linux raw UDP test
        run: go test -race -c -o "$RUNNER_TEMP/openflux-l3.test" ./tunnel/l3
      - name: Check raw UDP, fragmentation and ICMP/MTU in a disposable namespace
        run: |
          sudo unshare --net sh -ec '
            ip link set lo up
            ip link set lo mtu 1280
            OPENFLUX_L3_INTEGRATION=1 "$1" -test.run "^TestLinuxRaw" -test.v -test.timeout=45s
          ' sh "$RUNNER_TEMP/openflux-l3.test"

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
